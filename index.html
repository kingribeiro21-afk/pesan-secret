<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ada Pesan Buat Kamu 💌</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="opening" class="opening">
  <div class="envelope-icon">💌</div>
  <h1>Ada pesan buat kamu</h1>
  <p>Klik tombol di bawah untuk membuka surat ❤️</p>
  <button id="openBtn" type="button" onclick="bukaSurat()">Buka Pesan</button>
</div>

<main id="letter" class="scene">
  <div class="envelope"></div>

  <div class="paper">
    <div id="date" class="date">0625</div>
    <div class="letter-text">
      <h2 id="greeting">Dear Love,</h2>
      <p id="message1"></p>
      <p id="message2"></p>
      <p id="message3"></p>
      <p id="message4"></p>
      <p id="message5"></p>
      <p id="message6"></p>
      <div id="signature" class="signature"></div>
    </div>
    <div class="big-heart">♡</div>
  </div>

  <div class="polaroid">
    <img src="photo.jpeg.jpeg" alt="Foto kenangan">
    <div class="photo-text">i love you &lt;3</div>
  </div>

  <div class="star">★</div>
  <div class="flower">🌸</div>
</main>

<audio id="music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicButton" class="music-button" type="button"
        onclick="toggleMusic()" aria-label="Putar atau hentikan musik">🎵</button>

<script src="script.js"></script>
</body>
</html>
